# Replace api.yourdomain.com with your real domain before issuing TLS certs.

server {
    listen 80;
    server_name api.yourdomain.com;

    # ACME challenge for Let's Encrypt / certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Before you have certs, you can proxy over HTTP by uncommenting below.
    # After certs are issued, redirect everything to HTTPS:
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10m;

    location / {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
